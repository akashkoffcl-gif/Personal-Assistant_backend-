name: Build Unified NOVA Android APK

on:
  push:
    branches:
      - feature/unified-android-apk
      - feature/phase-54-android-jarvis-companion
  workflow_dispatch:

jobs:
  build:
    name: Build Unified Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || $ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Assemble Debug APK
        working-directory: apps-mobile/nova-android
        run: |
          # Ensure gradlew exists or generate it using gradle 8.9
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        id: verify-apk
        run: |
          APK_PATH=$(find apps-mobile/nova-android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi
          echo "APK Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-unified-debug-apk
          path: ${{ steps.verify-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
