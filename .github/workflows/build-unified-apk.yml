name: Build Unified NOVA Android APK

on:
  push:
    branches:
      - feature/unified-android-apk
      - feature/phase-54-android-jarvis-companion
  workflow_dispatch:

jobs:
  build:
    name: Build Unified Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps-mobile/nova-android/**/*.gradle*', 'apps-mobile/nova-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble Debug APK
        working-directory: apps-mobile/nova-android
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-unified-debug-apk
          path: apps-mobile/nova-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
